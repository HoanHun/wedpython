{% extends 'app/base.html' %} {% load static %}

<!doctype html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <!--[if lt IE 7]>
      <p class="browsehappy">
        You are using an <strong>outdated</strong> browser. Please
        <a href="#">upgrade your browser</a> to improve your experience.
      </p>
    <![endif]-->
    {% block search %}
    <div class="row" style="width: 100%">
      <!-- Hàng -->
      {% for product in products %}
      <!-- Lặp qua từng sản phẩm -->
      <div class="col-lg-4">
        <!--cột -->
        <!-- điều chỉnh hình-->
        <img
          class="thumbnail"
          src="{{ product.ImageURL }}"
          alt="{{ product.name }}"
        />
        <!--Thông tin cơ bản và nút thêm vào giỏ hàng-->
        <div class="box-element product">
          <h6><strong>{{ product.name }}</strong></h6>
          <hr />
          <!-- đưa nút thêm vào -->
          <button
            data-product="{{ product.id }}"
            data-action="add"
            class="btn btn-outline-secondary add-btn update-cart"
          >
            Thêm vào giỏ hàng
          </button>
          <a class="btn btn-outline-success" href="#">Xem chi tiết</a>
          <h3 style="display: inline-block; float: right">
            <strong>{{ product.price|floatformat:0 }} VND</strong>
          </h3>
        </div>
      </div>
      {% endfor %}
    </div>
    {% endblock search %}
    <script src="" async defer></script>
  </body>
</html>
